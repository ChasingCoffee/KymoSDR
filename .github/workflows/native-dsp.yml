name: Native DSP

on:
  push:
    paths:
      - 'native/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/Thetis.MemoryProbe/**'
      - 'scripts/build-hpsdrsim.sh'
      - 'Project Files/Source/wdsp/**'
      - 'Project Files/Source/ChannelMaster/**'
      - 'Project Files/lib/portaudio-19.7.0/**'
      - 'Project Files/lib/NR_Algorithms_x64/src/**'
      - 'global.json'
      - 'Thetis.CrossPlatform.slnx'
      - '.github/workflows/native-dsp.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/Thetis.MemoryProbe/**'
      - 'scripts/build-hpsdrsim.sh'
      - 'Project Files/Source/wdsp/**'
      - 'Project Files/Source/ChannelMaster/**'
      - 'Project Files/lib/portaudio-19.7.0/**'
      - 'Project Files/lib/NR_Algorithms_x64/src/**'
      - 'global.json'
      - 'Thetis.CrossPlatform.slnx'
      - '.github/workflows/native-dsp.yml'
  workflow_dispatch:
    inputs:
      receive_soak:
        description: 'Receive endurance run (30-minute option adds time on all three OSes)'
        type: choice
        default: short
        options:
          - short
          - 30-minutes
      desktop_soak:
        description: 'Simulator desktop endurance (no physical output; 30-minute option runs on all three OSes)'
        type: choice
        default: short
        options:
          - short
          - 30-minutes

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'
  THETIS_NATIVE_DIR: '${{ github.workspace }}/artifacts/native/stage/Release'

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmake_args: '-A x64'
          - os: macos-latest
            cmake_args: ''
          - os: ubuntu-latest
            cmake_args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.desktop_soak == '30-minutes' && 100 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Record tools and host architecture
        run: |
          cmake --version
          dotnet --info
      - name: Linux audio and virtual display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1 xvfb
      - name: Configure source-built dependencies and WDSP
        run: cmake -S native -B artifacts/native -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}
      - name: Build native library and tests
        run: cmake --build artifacts/native --config Release --parallel 4
      - name: Restore pinned managed dependencies
        run: dotnet restore Thetis.CrossPlatform.slnx --locked-mode
      - name: Build managed harness
        run: dotnet build Thetis.CrossPlatform.slnx -c Release --no-restore
      # Exercise the new slice before the longer inherited lifecycle campaigns.
      # All existing full-suite, sanitizer and memory-budget gates remain below.
      - name: G2 safety, discovery, preferences and live output checkpoint (fixtures only)
        shell: pwsh
        run: |
          $results = Join-Path '${{ github.workspace }}' 'artifacts/receive-checkpoint'
          New-Item -ItemType Directory -Force $results | Out-Null
          ctest --test-dir artifacts/native -C Release --verbose -R 'g2_receive_|p2_receive_packet_codec|receive_playback' --output-junit (Join-Path $results 'native.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suites = @(
            @{ Project = 'Thetis.Core.Tests'; Filter = 'FullyQualifiedName~G2'; Required = @('G2ReceiveCliTests','G2ListenCliTests','G2SoakCliTests') },
            @{ Project = 'Thetis.Engine.Tests'; Filter = 'FullyQualifiedName~PlaybackTests|FullyQualifiedName~OutputSwitchTests|FullyQualifiedName~AudioControlsTests'; Required = @('HardwarePlaybackTests','OutputSwitchTests','AudioControlsTests') },
            @{ Project = 'Thetis.Desktop.Tests'; Filter = ''; Required = @('HardwareUiTests','ConnectionPreferencesTests','LiveOutputTests','AudioControlsTests','PreferencesTests') }
          )
          foreach ($suite in $suites) {
            $testArgs = @('test', "tests/$($suite.Project)", '-c', 'Release', '--no-build', '--no-restore', '--blame-hang-timeout', '2m', '--logger', "trx;LogFileName=$($suite.Project).trx", '--results-directory', $results)
            if ($suite.Filter) { $testArgs += @('--filter', $suite.Filter) }
            dotnet @testArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            [xml]$trx = Get-Content -Raw (Join-Path $results "$($suite.Project).trx")
            $counts = $trx.SelectSingleNode("//*[local-name()='Counters']")
            if (-not $counts -or [int]$counts.total -lt 1 -or [int]$counts.passed -ne [int]$counts.total) {
              throw "Checkpoint requires actual passes with no skips: $($suite.Project)"
            }
            $classes = @($trx.SelectNodes("//*[local-name()='TestMethod']/@className") | ForEach-Object { $_.Value.Split('.')[-1] })
            foreach ($required in $suite.Required) {
              if ($classes -notcontains $required) { throw "Missing checkpoint coverage: $required" }
            }
          }
      - name: Hardware endurance help only (no discovery, sockets or devices)
        run: dotnet run --project src/Thetis.Headless -c Release --no-build --no-restore -- g2-soak --help
      - name: Retain focused receive checkpoint results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receive-checkpoint-${{ matrix.os }}
          path: artifacts/receive-checkpoint/**
          if-no-files-found: warn
          retention-days: 14
      - name: One virtual hour of real PCM clock recovery (no physical output)
        shell: pwsh
        run: |
          $clockTest = Join-Path $env:THETIS_NATIVE_DIR 'playback_clock_tests'
          if ($IsWindows) { $clockTest += '.exe' }
          & $clockTest --soak
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: P1/P2 playback, mute and reconnect (no physical audio devices)
        run: dotnet run --project src/Thetis.Headless -c Release --no-build --no-restore -- playback-selftest --native-dir "${{ env.THETIS_NATIVE_DIR }}"
      - name: Publish framework-dependent desktop with source-built native libraries
        shell: pwsh
        run: |
          dotnet publish src/Thetis.Desktop -c Release --no-restore -o artifacts/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts/desktop/native | Out-Null
          Get-ChildItem $env:THETIS_NATIVE_DIR | Where-Object { $_.Name -match '^(libthetis_(wdsp|audio)\.(so|dylib)|thetis_(wdsp|audio)\.dll)$' } | Copy-Item -Destination artifacts/desktop/native
      - name: Published desktop native window (muted simulator, no physical output)
        if: runner.os != 'Linux'
        timeout-minutes: 3
        working-directory: artifacts/desktop
        run: dotnet Thetis.Desktop.dll --smoke --native-dir "${{ github.workspace }}/artifacts/desktop/native"
      - name: Published Linux X11 desktop (muted simulator under Xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        working-directory: artifacts/desktop
        run: xvfb-run -a dotnet Thetis.Desktop.dll --smoke --native-dir "${{ github.workspace }}/artifacts/desktop/native"
      - name: Desktop smoke startup failure must return an error
        timeout-minutes: 3
        working-directory: artifacts/desktop
        shell: pwsh
        run: |
          $missingNative = Join-Path (Get-Location) 'deliberately-missing-native'
          if ($IsLinux) { xvfb-run -a dotnet Thetis.Desktop.dll --smoke --native-dir $missingNative }
          else { dotnet Thetis.Desktop.dll --smoke --native-dir $missingNative }
          if ($LASTEXITCODE -ne 4) { throw "Expected desktop startup failure exit 4, got $LASTEXITCODE" }
          exit 0
      - name: Desktop endurance with retune, resize and P2-P1-P2 reconnects
        timeout-minutes: ${{ inputs.desktop_soak == '30-minutes' && 35 || 3 }}
        working-directory: artifacts/desktop
        shell: pwsh
        run: |
          $seconds = 60
          if ('${{ inputs.desktop_soak }}' -eq '30-minutes') { $seconds = 1800 }
          $report = Join-Path '${{ github.workspace }}' 'artifacts/desktop-endurance.json'
          $native = Join-Path (Get-Location) 'native'
          if ($IsLinux) { xvfb-run -a dotnet Thetis.Desktop.dll --endurance-seconds $seconds --report $report --native-dir $native }
          else { dotnet Thetis.Desktop.dll --endurance-seconds $seconds --report $report --native-dir $native }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Failed desktop endurance retains a diagnostic report
        timeout-minutes: 3
        working-directory: artifacts/desktop
        shell: pwsh
        run: |
          $missingNative = Join-Path (Get-Location) 'deliberately-missing-native'
          $report = Join-Path '${{ github.workspace }}' 'artifacts/desktop-endurance-failure.json'
          if ($IsLinux) { xvfb-run -a dotnet Thetis.Desktop.dll --endurance-seconds 30 --report $report --native-dir $missingNative }
          else { dotnet Thetis.Desktop.dll --endurance-seconds 30 --report $report --native-dir $missingNative }
          if ($LASTEXITCODE -ne 4) { throw "Expected desktop endurance failure exit 4, got $LASTEXITCODE" }
          $result = Get-Content -Raw $report | ConvertFrom-Json
          if ($result.passed -or -not $result.failureType -or $result.diagnostics.sessionsStarted -ne 0) { throw 'Invalid failure diagnostic report' }
          exit 0
      - name: Retain desktop endurance diagnostics (no waveform or local paths)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-diagnostics-${{ matrix.os }}
          path: artifacts/desktop-endurance*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Offline native ABI, DSP and lifecycle tests
        run: ctest --test-dir artifacts/native -C Release --verbose
      - name: Build pinned independent P1 reference (confined loopback adapter)
        if: runner.os != 'Windows'
        run: bash scripts/build-hpsdrsim.sh --loopback
      - name: Independent P1 reference interoperability (owned process, no hardware)
        if: runner.os != 'Windows'
        shell: bash
        run: THETIS_P1_REFERENCE_SIM="$GITHUB_WORKSPACE/artifacts/external/pihpsdr/hpsdrsim-loopback" dotnet test tests/Thetis.Engine.Tests -c Release --no-build --no-restore --filter FullyQualifiedName~P1ReferenceTests --logger "console;verbosity=normal" --blame-hang-timeout 2m
      - name: Linux reconnect allocator regression (loopback only)
        if: runner.os == 'Linux'
        # Fresh processes: allocator history from one mode must not contaminate another.
        # No forced GC, allocator trimming or global allocator environment tuning.
        run: |
          dotnet run --project tools/Thetis.MemoryProbe -c Release --no-build --no-restore -- "${{ env.THETIS_NATIVE_DIR }}" same 6
          dotnet run --project tools/Thetis.MemoryProbe -c Release --no-build --no-restore -- "${{ env.THETIS_NATIVE_DIR }}" async 20 --check-linux-budget
          dotnet run --project tools/Thetis.MemoryProbe -c Release --no-build --no-restore -- "${{ env.THETIS_NATIVE_DIR }}" hopping 20 --check-linux-budget
      - name: Offline CLI self-test (native library required)
        run: dotnet run --project src/Thetis.Headless -c Release --no-build --no-restore -- dsp-selftest --native-dir "${{ env.THETIS_NATIVE_DIR }}"
      - name: Offline ChannelMaster CLI (100 lifecycles, no devices)
        run: dotnet run --project src/Thetis.Headless -c Release --no-build --no-restore -- session-selftest --native-dir "${{ env.THETIS_NATIVE_DIR }}"
      - name: Simulator to native P2, ChannelMaster and WDSP audio/spectrum
        run: dotnet run --project src/Thetis.Headless -c Release --no-build --no-restore -- receive-selftest --native-dir "${{ env.THETIS_NATIVE_DIR }}"
      - name: Receive mode and filter switching (loopback only)
        run: dotnet run --project src/Thetis.Headless -c Release --no-build --no-restore -- receive-controls-selftest --native-dir "${{ env.THETIS_NATIVE_DIR }}"
      - name: P1 receive audio, spectrum, controls and reconnect (loopback only)
        run: dotnet run --project src/Thetis.Headless -c Release --no-build --no-restore -- p1-receive-selftest --native-dir "${{ env.THETIS_NATIVE_DIR }}"
      - name: P1/P2 gain, mute and AGC signal steps (loopback only)
        run: dotnet run --project src/Thetis.Headless -c Release --no-build --no-restore -- receive-gain-selftest --native-dir "${{ env.THETIS_NATIVE_DIR }}"
      - name: Short receive endurance and fault campaign (loopback only)
        if: github.event_name != 'workflow_dispatch' || inputs.receive_soak != '30-minutes'
        run: dotnet run --project src/Thetis.Headless -c Release --no-build --no-restore -- receive-soak --native-dir "${{ env.THETIS_NATIVE_DIR }}" --duration-seconds 10 --reconnects 2
      - name: Opt-in 30-minute receive endurance and fault campaign (loopback only)
        if: github.event_name == 'workflow_dispatch' && inputs.receive_soak == '30-minutes'
        run: dotnet run --project src/Thetis.Headless -c Release --no-build --no-restore -- receive-soak --native-dir "${{ env.THETIS_NATIVE_DIR }}" --duration-seconds 1800 --reconnects 10
      - name: Managed and native integration regressions
        # All transport fixture traffic is hard-restricted to IPv4 loopback.
        run: dotnet test Thetis.CrossPlatform.slnx -c Release --no-build --no-restore --blame-hang-timeout 2m --logger trx --results-directory artifacts/test-results
      - name: Loopback transport CLI (100 socket lifecycles, no radio commands)
        run: dotnet run --project src/Thetis.Headless -c Release --no-build --no-restore -- transport-selftest --native-dir "${{ env.THETIS_NATIVE_DIR }}"
      - name: macOS dependency inspection
        if: runner.os == 'macOS'
        run: |
          file artifacts/native/stage/Release/libthetis_wdsp.dylib
          otool -L artifacts/native/stage/Release/libthetis_wdsp.dylib
      - name: Linux dependency inspection
        if: runner.os == 'Linux'
        run: |
          file artifacts/native/stage/Release/libthetis_wdsp.so
          ldd artifacts/native/stage/Release/libthetis_wdsp.so
      - name: Retain full managed regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: managed-regressions-${{ matrix.os }}
          path: artifacts/test-results/**
          if-no-files-found: warn
          retention-days: 14

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Linux audio build dependency
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Configure AddressSanitizer and UndefinedBehaviorSanitizer
        run: cmake -S native -B artifacts/native-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTHETIS_SANITIZE=ON
      - name: Build instrumented native code
        run: cmake --build artifacts/native-asan --parallel 4
      - name: Run instrumented tests
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: ctest --test-dir artifacts/native-asan --verbose
